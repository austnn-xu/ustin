name: CI
on:
  push:
    branches: [main, claude/trash-disposal-mvp-xjiyw5]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Knowledge base tests
        run: npm test
      - name: Install app dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck
      - name: Design tokens
        working-directory: mobile
        run: npm run check:tokens
      - name: Colour contrast
        working-directory: mobile
        run: npm run check:contrast
      - name: Build the website and the app (what GitHub Pages serves)
        working-directory: mobile
        run: npm run build:pages
      - name: Build is hardened
        working-directory: mobile
        run: |
          grep -q "Content-Security-Policy" pages/app/index.html
          grep -q "Content-Security-Policy" pages/index.html
          grep -q "redirect.js" pages/404.html
